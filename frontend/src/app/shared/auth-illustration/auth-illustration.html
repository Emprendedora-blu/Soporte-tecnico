<div class="auth-illustration">
  <div class="auth-illustration__dots" aria-hidden="true"></div>
  <div class="auth-illustration__glow" aria-hidden="true"></div>
  <div class="auth-illustration__ring" aria-hidden="true"></div>

  <div class="auth-illustration__content">
    <h1>Servicio <span>Técnico</span></h1>
    <p>{{ subtitle }}</p>

    <svg class="auth-illustration__art" viewBox="0 0 420 320" fill="none" aria-hidden="true">
      <!-- decorative dot grid -->
      <g class="art-dotgrid" opacity="0.35">
        @for (row of [0, 1, 2, 3]; track row) {
          @for (col of [0, 1, 2, 3]; track col) {
            <circle [attr.cx]="70 + col * 11" [attr.cy]="70 + row * 11" r="1.6" fill="#8fa3e0" />
          }
        }
      </g>

      <!-- gear decoration -->
      <g class="art-gear" opacity="0.5" stroke="#5b74c9" stroke-width="1.6">
        <circle cx="26" cy="150" r="16" />
        <circle cx="26" cy="150" r="5" fill="#5b74c9" stroke="none" />
        <path
          d="M26 130v6M26 164v6M6 150h6M40 150h6M11.6 135.6l4.2 4.2M36.2 160.2l4.2 4.2M11.6 164.4l4.2-4.2M36.2 139.8l4.2-4.2"
        />
      </g>

      <!-- phone (tilted) -->
      <g transform="rotate(-9 55 210)">
        <rect x="20" y="150" width="70" height="128" rx="13" fill="#0d1428" />
        <rect x="27" y="159" width="56" height="102" rx="4" fill="url(#phoneScreen)" />
        <path
          d="M60 197a10 10 0 0 0-8 16l-15 15 6 6 15-15a10 10 0 0 0 13-13l-7 7-5-5 7-7a10 10 0 0 0-6-4Z"
          fill="#67b8ff"
        />
      </g>

      <!-- laptop -->
      <g>
        <rect x="112" y="46" width="222" height="150" rx="14" fill="#101a3d" />
        <rect x="124" y="58" width="198" height="118" rx="4" fill="#f4f6fd" />
        <rect x="124" y="58" width="46" height="118" fill="#e6eaf8" />
        <rect x="134" y="68" width="26" height="7" rx="3.5" fill="#3f6bde" />
        <rect x="134" y="84" width="26" height="5" rx="2.5" fill="#c7d0ef" />
        <rect x="134" y="96" width="26" height="5" rx="2.5" fill="#c7d0ef" />
        <rect x="134" y="108" width="26" height="5" rx="2.5" fill="#c7d0ef" />
        @for (row of [0, 1, 2, 3]; track row) {
          <circle [attr.cy]="72 + row * 22" cx="184" r="4.5" fill="#9db2ef" />
          <rect [attr.y]="69 + row * 22" x="196" width="112" height="6" rx="3" fill="#dde3f7" />
        }
        <path d="M96 196h256l14 20a8 8 0 0 1-7 12H89a8 8 0 0 1-7-12l14-20Z" fill="#1a2757" />
      </g>

      <!-- checkmark badge -->
      <g>
        <circle cx="322" cy="60" r="27" fill="url(#badgeGrad)" />
        <path
          d="M310 61l8 8 15-16"
          stroke="#fff"
          stroke-width="4.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>

      <!-- toolbox + wrench -->
      <g>
        <rect x="330" y="176" width="112" height="68" rx="9" fill="url(#boxGrad)" />
        <rect x="365" y="156" width="42" height="26" rx="7" fill="#16308f" />
        <rect x="330" y="202" width="112" height="7" fill="#16308f" />
        <g transform="rotate(18 415 150)">
          <path
            d="M424 128a11 11 0 0 0-14.8 12.7L392 158l9.5 9.5 17.3-17.3A11 11 0 0 0 431 136l-8 8-5.5-5.5 8-8Z"
            fill="#f0a828"
          />
        </g>
      </g>

      <defs>
        <linearGradient id="phoneScreen" x1="27" y1="159" x2="83" y2="261" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1c2c63" />
          <stop offset="1" stop-color="#101a3d" />
        </linearGradient>
        <linearGradient id="badgeGrad" x1="295" y1="33" x2="349" y2="87" gradientUnits="userSpaceOnUse">
          <stop stop-color="#4fa3ff" />
          <stop offset="1" stop-color="#1c3fa0" />
        </linearGradient>
        <linearGradient id="boxGrad" x1="330" y1="176" x2="442" y2="244" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3f6bde" />
          <stop offset="1" stop-color="#1c3fa0" />
        </linearGradient>
      </defs>
    </svg>
  </div>
</div>
