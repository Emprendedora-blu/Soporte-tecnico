<div class="auth-page">
  <app-auth-illustration subtitle="Crea tu cuenta y registra tus solicitudes de soporte en segundos" />

  <div class="auth-panel">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <h2>Crear cuenta</h2>

      @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
      }

      <div class="form-field">
        <label for="firstName">Nombres</label>
        <input id="firstName" type="text" formControlName="firstName" placeholder="Tus nombres" />
      </div>

      <div class="form-field">
        <label for="lastName">Apellidos</label>
        <input id="lastName" type="text" formControlName="lastName" placeholder="Tus apellidos" />
      </div>

      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <div class="input-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M3 5.5A1.5 1.5 0 0 1 4.5 4h11A1.5 1.5 0 0 1 17 5.5v9A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5v-9Z"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path d="m4 5.5 6 5 6-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nombre@ejemplo.com"
          />
        </div>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="input-icon">
          <svg viewBox="0 0 20 20" fill="none">
            <rect x="4" y="9" width="12" height="8" rx="1.6" stroke="currentColor" stroke-width="1.4" />
            <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
          />
          <button
            type="button"
            class="input-icon__toggle"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 20 20" fill="none">
                <path
                  d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4" />
              </svg>
            } @else {
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M3 3l14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
                <path
                  d="M5.6 5.9C3.6 7.2 2 10 2 10s3 5.5 8 5.5c1.5 0 2.8-.5 3.9-1.2M8.6 4.7c.45-.13.9-.2 1.4-.2 5 0 8 5.5 8 5.5s-.7 1.3-2 2.7"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="loading()">
        {{ loading() ? 'Creando cuenta...' : 'Registrarme' }}
        @if (!loading()) {
          <svg viewBox="0 0 20 20" fill="none">
            <path
              d="M4 10h12M11 5l5 5-5 5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>

      <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>

      <div class="auth-secure">
        <svg viewBox="0 0 20 20" fill="none">
          <path
            d="M10 2 4 4.5V9c0 4 2.6 7 6 8.5 3.4-1.5 6-4.5 6-8.5V4.5L10 2Z"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>
        Acceso seguro
      </div>
    </form>
  </div>
</div>
