<aside class="sidebar">
  <div class="sidebar__header">
    <div class="sidebar__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M14.7 6.2a4.9 4.9 0 0 0-6 6L3.5 17.4a2.2 2.2 0 1 0 3.1 3.1l5.2-5.2a4.9 4.9 0 0 0 6-6l-3 3-3-3 2.9-3.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div>
      <p class="sidebar__title">Servicio Técnico</p>
      <p class="sidebar__subtitle">{{ subtitle }}</p>
    </div>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" class="sidebar__link">
        <span class="sidebar__icon">
          @switch (item.icon) {
            @case ('clipboard') {
              <svg viewBox="0 0 20 20" fill="none">
                <rect x="4" y="3.5" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                <rect x="7" y="2" width="6" height="3" rx="1" fill="currentColor" />
                <path d="M7 9h6M7 12.5h6M7 15.5h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            }
            @case ('user') {
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.5" />
                <path d="M3.5 17c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            }
            @case ('building') {
              <svg viewBox="0 0 20 20" fill="none">
                <rect x="4" y="3" width="8" height="14" rx="1" stroke="currentColor" stroke-width="1.5" />
                <rect x="12" y="8" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.5" />
                <path d="M6.5 6h1M6.5 9h1M6.5 12h1M9.5 6h1M9.5 9h1M9.5 12h1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
              </svg>
            }
            @case ('wrench') {
              <svg viewBox="0 0 20 20" fill="none">
                <path
                  d="M14.2 3.3a4 4 0 0 0-5.4 4.6L3.5 13.2a1.8 1.8 0 0 0 2.5 2.5L11.3 10a4 4 0 0 0 4.6-5.4l-2.5 2.5-2-2 2.5-2.5Z"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                />
              </svg>
            }
          }
        </span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    <button type="button" class="sidebar__logout" (click)="logout()">
      <svg viewBox="0 0 20 20" fill="none">
        <path
          d="M8 17H5a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 5 3h3M13.5 14l3.5-4-3.5-4M17 10H8"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Cerrar sesión
    </button>
  </div>
</aside>
